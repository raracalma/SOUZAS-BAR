name: Build Souza's Bar APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Preparar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Gerar estrutura Android
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name souzas_bar --org com.souzasbar --no-pub /tmp/souzas_bar_scaffold
            cp -R /tmp/souzas_bar_scaffold/android ./android
          fi

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar APK
        run: flutter build apk --debug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: souzas-bar-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
