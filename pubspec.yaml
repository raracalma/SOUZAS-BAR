name: souzas_bar
description: Aplicativo de comandas e gestao do Souza's Bar
publish_to: 'none'
version: 0.7.2+9

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.2
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/souzas_bar_logo.png

flutter_launcher_icons:
  android: launcher_icon
  image_path_android: assets/images/souzas_bar_logo.png
  ios: false
  image_path: assets/images/souzas_bar_logo.png
  adaptive_icon_background: "#1B201D"
  adaptive_icon_foreground: assets/images/souzas_bar_logo.png
