name: Build Souza's Bar APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Preparar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Gerar estrutura Android
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name souzas_bar --org com.souzasbar --no-pub /tmp/souzas_bar_scaffold
            cp -R /tmp/souzas_bar_scaffold/android ./android
          fi

      - name: Configurar nome do aplicativo
        run: |
          python3 - <<'PYNAME'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s = s.replace('android:label="souzas_bar"', 'android:label="Comanda Souza\'s"')
          s = s.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@mipmap/launcher_icon"')
          p.write_text(s)
          print("Nome do aplicativo configurado.")
          PYNAME

      - name: Preparar assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ runner.temp }}/souzas-bar-release.jks
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

          python3 - <<'PY'
          from pathlib import Path
          import os

          path = Path("android/app/build.gradle.kts")
          if not path.exists():
              raise SystemExit("Arquivo Gradle Kotlin nao encontrado.")

          content = path.read_text()
          marker = "    buildTypes {"
          old = '            signingConfig = signingConfigs.getByName("debug")'

          config = '''
              signingConfigs {
                  create("release") {
                      storeFile = file(System.getenv("KEYSTORE_PATH"))
                      storePassword = System.getenv("KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("KEY_ALIAS")
                      keyPassword = System.getenv("KEY_PASSWORD")
                  }
              }

          '''

          if marker not in content or old not in content:
              raise SystemExit("Modelo Gradle inesperado. Compilacao interrompida.")

          content = content.replace(marker, config + marker, 1)
          content = content.replace(
              old,
              '            signingConfig = signingConfigs.getByName("release")',
              1
          )
          path.write_text(content)
          print("Assinatura configurada.")
          PY

      - name: Instalar dependencias
        run: flutter pub get

      - name: Gerar icones oficiais
        run: dart run flutter_launcher_icons

      - name: Validar icone personalizado
        run: |
          python3 - <<'PYICON'
          from pathlib import Path

          res = Path("android/app/src/main/res")
          manifest = Path("android/app/src/main/AndroidManifest.xml").read_text()

          if 'android:icon="@mipmap/launcher_icon"' not in manifest:
              raise SystemExit("ERRO: manifesto nao aponta para launcher_icon.")

          icons = list(res.rglob("launcher_icon.png"))
          if not icons:
              raise SystemExit("ERRO: icone launcher_icon.png nao foi gerado.")

          for icon in icons:
              if not icon.read_bytes().startswith(b"\x89PNG\r\n\x1a\n"):
                  raise SystemExit(f"ERRO: arquivo de icone invalido: {icon}")

          adaptive = res / "mipmap-anydpi-v26/launcher_icon.xml"
          if not adaptive.is_file():
              raise SystemExit("ERRO: icone adaptativo nao foi gerado.")

          adaptive_xml = adaptive.read_text()
          if '@drawable/ic_launcher_foreground' not in adaptive_xml:
              raise SystemExit("ERRO: XML adaptativo nao referencia a imagem frontal.")

          foreground = list(res.glob("drawable-*/ic_launcher_foreground.png"))
          if not foreground:
              raise SystemExit("ERRO: imagem frontal do icone adaptativo ausente.")

          for icon in foreground:
              if not icon.read_bytes().startswith(b"\x89PNG\r\n\x1a\n"):
                  raise SystemExit(f"ERRO: imagem frontal invalida: {icon}")

          print("OK: manifesto, icones PNG e icone adaptativo validados.")
          PYICON

      - name: Compilar APK Release
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/souzas-bar-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Renomear APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/souzas-bar-v-0.7.2.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: souzas-bar-v-0.7.2
          path: build/app/outputs/flutter-apk/souzas-bar-v-0.7.2.apk
